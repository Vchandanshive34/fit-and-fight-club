/* ============================================================
   TIMETABLE
   ============================================================ */
function viewClasses(){
  const all = B(S.classes);
  const seats = all.reduce((s,c)=>s+c.cap,0);
  const bookd = all.reduce((s,c)=>s+c.booked.length,0);
  const waits = all.reduce((s,c)=>s+c.waitlist.length,0);
  const full  = all.filter(c=>c.booked.length>=c.cap).length;
  const byName = {};
  all.forEach(c=>{ byName[c.name] = byName[c.name] || {cap:0,booked:0,n:0,disc:c.disc,level:c.level};
    byName[c.name].cap+=c.cap; byName[c.name].booked+=c.booked.length; byName[c.name].n++; });
  const ranked = Object.entries(byName).map(([name,v])=>({name,...v,fill:v.booked/v.cap})).sort((a,b)=>b.fill-a.fill);

  return `<div class="stack">
    <div class="kpis">
      ${kpi("Weekly sessions", all.length, `${Object.keys(byName).length} formats · ${B(COACHES).length} coaches`, "var(--accent)")}
      ${kpi("Seat occupancy", (seats?Math.round(bookd/seats*100):0)+"%", `${bookd} of ${seats} seats booked`, "var(--good)")}
      ${kpi("Sessions at capacity", full, full?"consider adding a slot":"room everywhere", full?"var(--warn)":"var(--good)")}
      ${kpi("On waitlists", waits, "members wanting a seat", waits?"var(--warn)":"var(--line-strong)")}
    </div>
    <div class="card">
      <div class="card-head"><h3>This week</h3><span class="hint">click a session to manage its roster</span>
        <span class="spacer"></span><span class="hint">${bLabel()}</span></div>
      <div class="card-body"><div class="sched">
        ${DAYNAMES.map((dn,d)=>`<div class="day-col">
          <div class="day-name ${d===TODAY.getDay()?"today":""}">${dn}${d===TODAY.getDay()?" · today":""}</div>
          ${all.filter(c=>c.dow===d).sort((a,b)=>a.time.localeCompare(b.time)).map(c=>{
            const co=coachById(c.coachId), fill=c.booked.length/c.cap;
            const col = fill>=1?"var(--crit)":fill>=.8?"var(--warn)":DISCIPLINES.find(x=>x.id===c.disc).fight?"var(--accent)":"var(--data)";
            return `<div class="klass" data-class="${c.id}" style="border-left-color:${col}">
              <span class="t">${c.time}</span><b>${esc(c.name)}</b>
              <div class="muted" style="font-size:10.5px">${esc(co.name.split(" ")[0])} · ${esc(c.room)}${UI.branch==="ALL"?" · "+branchById(c.branchId).name:""}</div>
              <div class="cap"><span class="num">${c.booked.length}/${c.cap}</span>
                ${c.waitlist.length?`<span class="num" style="color:var(--warn)">+${c.waitlist.length} wl</span>`:""}</div>
              <div style="margin-top:4px">${bar(c.booked.length,c.cap)}</div></div>`;}).join("")
            || '<div class="hint" style="padding:5px 2px">—</div>'}
        </div>`).join("")}
      </div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Which formats fill up</h3>
        <span class="hint">average occupancy across the week — the low ones are costing you floor time</span></div>
      <div class="card-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Format</th><th>Discipline</th><th>Level</th><th>Sessions / week</th><th>Occupancy</th><th class="ta-r">Booked</th></tr></thead>
        <tbody>${ranked.map(r=>`<tr class="norow">
          <td><b style="font-weight:600">${esc(r.name)}</b></td>
          <td>${discTags([r.disc])}</td>
          <td class="muted">${r.level}</td>
          <td class="num">${r.n}</td>
          <td style="min-width:146px"><div class="row" style="gap:8px">
            <div style="flex:1">${bar(r.booked,r.cap, r.fill>=.85?"good":r.fill<.55?"crit":"")}</div>
            <b class="num" style="font-size:12px">${Math.round(r.fill*100)}%</b></div></td>
          <td class="ta-r num">${r.booked}/${r.cap}</td></tr>`).join("") || emptyRow(6,"No classes at this centre.")}</tbody>
      </table></div></div>
    </div>
  </div>`;
}

function openClass(id){
  const c = S.classes.find(x=>x.id===id); if(!c) return;
  const co = coachById(c.coachId), br = branchById(c.branchId);
  const row = (mid, wait) => {
    const m = memberById(mid); if(!m) return "";
    return `<div class="mini"><span style="display:flex;gap:8px;align-items:center">
      <span class="avatar${m.track==="fight"?" fighter":""}" style="width:24px;height:24px;font-size:11px">${initials(m.name)}</span>
      <span>${esc(m.name)}</span></span>
      <span style="display:flex;gap:6px;align-items:center">
        ${wait?`<button class="btn btn-sm" data-promote="${c.id}:${mid}">Give seat</button>`:""}
        <button class="btn btn-sm btn-ghost" data-unbook="${c.id}:${mid}">Remove</button></span></div>`;

function viewCoaches(){

    const klasses = S.classes.filter(c=>c.coachId===t.id);

function viewBilling(){
  const f = UI.bFilter;
  const inv = B(S.invoices);
  let list = inv.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(f!=="all") list = list.filter(i=> f==="unpaid" ? i.status!=="paid" : i.status===f);

  const mStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const collected = inv.filter(i=>new Date(i.date)>=mStart).reduce((s,i)=>s+i.paid,0);
  const billed    = inv.filter(i=>new Date(i.date)>=mStart).reduce((s,i)=>s+i.amount,0);
  const dues      = inv.filter(i=>i.status!=="paid").reduce((s,i)=>s+(i.amount-i.paid),0);
  const overdue   = inv.filter(i=>i.status==="overdue");

  const months=[];
  for(let k=5;k>=0;k--){
    const from=new Date(TODAY.getFullYear(),TODAY.getMonth()-k,1), to=new Date(TODAY.getFullYear(),TODAY.getMonth()-k+1,1);
    months.push({label:from.toLocaleDateString("en-IN",{month:"short"}),
      v:inv.filter(i=>{const d=new Date(i.date);return d>=from&&d<to;}).reduce((s,i)=>s+i.paid,0)});
  }
  const rmax = Math.max(...months.map(m=>m.v),1);
  const act = activeMembers();
  const byPlan = PLANS.map(p=>({p, n:act.filter(m=>m.planId===p.id).length}))
    .map(x=>({...x, mrr:x.n*x.p.price/x.p.months})).filter(x=>x.n).sort((a,b)=>b.mrr-a.mrr);
  const mrr = byPlan.reduce((s,x)=>s+x.mrr,0);
  const c = {all:inv.length, unpaid:inv.filter(i=>i.status!=="paid").length, overdue:overdue.length,
    partial:inv.filter(i=>i.status==="partial").length, paid:inv.filter(i=>i.status==="paid").length};
  const chip=(id,l)=>`<button class="chip" data-bfilter="${id}" aria-pressed="${f===id}">${l} <span class="num muted">${c[id]}</span></button>`;

  return `<div class="stack">
    <div class="kpis">
      ${kpi("Collected this month", money(collected), `of ${money(billed)} billed`, "var(--good)")}
      ${kpi("Monthly recurring", money(mrr), "normalised across all plans", "var(--accent)")}
      ${kpi("Outstanding", money(dues), `${c.unpaid} open invoices`, "var(--crit)")}
      ${kpi("Overdue", overdue.length, money(overdue.reduce((s,i)=>s+(i.amount-i.paid),0))+" past the due date", overdue.length?"var(--crit)":"var(--good)")}
    </div>
    <div class="split">
      <div class="card">
        <div class="card-head"><h3>Collections, last 6 months</h3><span class="hint">the current month is still in progress</span></div>
        <div class="card-body">
          <div class="bars">${months.map(m=>`<div class="bar ${m.v===rmax?"hi":""}" style="height:${Math.max(2,m.v/rmax*100)}%" title="${m.label} · ${money(m.v)}"></div>`).join("")}</div>
          <div class="bars-x">${months.map(m=>`<span>${m.label}</span>`).join("")}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Revenue by plan</h3><span class="hint">monthly equivalent</span></div>
        <div class="card-body">${byPlan.map(x=>`<div style="margin-bottom:10px">
          <div class="mini" style="border:0;padding:0 0 4px"><span>${x.p.name} <span class="muted num">· ${x.n}</span></span>
            <b class="num">${money(x.mrr)}</b></div>${bar(x.mrr, byPlan[0].mrr||1, x.p.track==="fight"?"crit":"")}</div>`).join("")}
          <div class="legend"><i style="background:var(--crit)"></i> fight track <i></i> fitness track</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="filters">${chip("all","All")}${chip("unpaid","Unpaid")}${chip("overdue","Overdue")}${chip("partial","Partial")}${chip("paid","Paid")}</div>
        <span class="spacer"></span><button class="btn btn-sm" id="exportInv">Export CSV</button></div>
      <div class="card-body tight"><div class="tbl-wrap" style="max-height:560px;overflow-y:auto"><table class="tbl">
        <thead><tr><th>Invoice</th><th>Member</th>${UI.branch==="ALL"?"<th>Centre</th>":""}<th>Item</th><th>Issued</th><th>Due</th>
          <th class="ta-r">Amount</th><th class="ta-r">Balance</th><th>Status</th><th></th></tr></thead>
        <tbody>${list.slice(0,140).map(i=>{const m=memberById(i.memberId), bal=i.amount-i.paid;
          return `<tr data-member="${i.memberId}">
          <td class="num"><b style="font-weight:600">${i.id}</b></td>
          <td>${m?`<b style="font-weight:600">${esc(m.name)}</b>`:"—"}</td>
          ${UI.branch==="ALL"?`<td class="muted">${branchById(i.branchId).name}</td>`:""}
          <td class="muted">${esc(i.item)}</td>
          <td class="num muted">${fmtDs(i.date)}</td>
          <td class="num muted">${fmtDs(i.due)}</td>
          <td class="ta-r num">${money(i.amount)}</td>
          <td class="ta-r num" style="color:${bal?"var(--crit)":"var(--ink-3)"}">${bal?money(bal):"—"}</td>
          <td><span class="pill ${i.status==="paid"?"pill-good":i.status==="overdue"?"pill-crit":i.status==="partial"?"pill-warn":""}">${i.status}</span></td>
          <td class="ta-r">${i.status!=="paid"?`<button class="btn btn-sm" data-pay="${i.id}">Record payment</button>`
            :`<span class="muted" style="font-size:11px">${esc(i.method||"")}</span>`}</td></tr>`;}).join("")
          || emptyRow(10,"No invoices match this filter.")}</tbody>
      </table></div></div>
    </div>
  </div>`;
}

  const br = branchById($("#lBranch").value);
  const trial = $("#lTrial").value || null;
  const l = {id:"LD-"+(++S.seq.l), branchId:br.id, name, phone:($("#lPhone").value||"").trim()||newPhone(),
    source:$("#lSource").value, stage: trial?"trial":"new", owner:br.manager, created:iso(TODAY),
    followUp:$("#lDate").value||iso(addD(TODAY,1)), interest:plan.id, value:plan.price,
    trialDate:trial, trialAttended:false, wants:$("#lWants").value,
    log:[{ts:iso(TODAY), text:"Enquiry captured · "+$("#lSource").value}]};
  if(trial) l.log.push({ts:iso(TODAY), text:"Free trial booked for "+fmtD(trial)});
  S.leads.push(l);
  closeOverlays(); route="leads"; render();
  toast(name+" added to the "+br.name+" pipeline");
}

function moveLead(id, dir){
  const l = S.leads.find(x=>x.id===id); if(!l) return;
  const i = STAGES.findIndex(s=>s.id===l.stage);
  const n = clamp(i+dir, 0, STAGES.length-1);
  if(n!==i) setStage(id, STAGES[n].id);
}
function setStage(id, stage){
  const l = S.leads.find(x=>x.id===id); if(!l) return;
  if(stage==="won"){ newMemberModal({name:l.name, phone:l.phone, source:l.source, interest:l.interest,
    branchId:l.branchId, wants:l.wants, fight:DISCIPLINES.find(d=>d.id===l.wants).fight, leadId:l.id}); return; }
  l.stage = stage;
  if(stage==="trial" && !l.trialDate) l.trialDate = iso(addD(TODAY,2));
  if(stage==="trialdone"){ l.trialAttended = true; if(!l.trialDate) l.trialDate = iso(TODAY); }
  l.log.push({ts:iso(TODAY), text:"Moved to "+stageById(stage).name});
  if(OPEN_STAGES.includes(stage) && days(TODAY,l.followUp)>=0) l.followUp = iso(addD(TODAY,2));
  render(); if($("#drawer").classList.contains("on")) openLead(id);
  toast(l.name+" → "+stageById(stage).name);
}

const csv = rows => rows.map(r=>r.map(c=>{
  const s=String(c??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(",")).join("\n");
function showCsv(title, text){
  openModal(`
    <div class="modal-head"><h2 style="font-size:22px;text-transform:uppercase">${esc(title)}</h2>
      <div class="hint" style="margin-top:3px">Select all and copy — downloads are blocked inside the preview frame.</div></div>
    <div class="modal-body"><textarea id="csvOut" rows="12" readonly
      style="width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)">${esc(text)}</textarea></div>
    <div class="modal-foot"><button class="btn" data-close="1">Close</button>
      <button class="btn btn-primary" id="copyCsv">Copy to clipboard</button></div>`);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-branch],[data-member],[data-lead],[data-class],[data-mfilter],[data-bfilter],[data-ffilter],[data-mtab],[data-renew],[data-dorenew],[data-pay],[data-dopay],[data-checkin],[data-freeze],[data-cancel],[data-track],[data-nudge],[data-move],[data-setstage],[data-addlog],[data-called],[data-convert],[data-booktrial],[data-savenote],[data-usept],[data-weigh],[data-spar],[data-book],[data-unbook],[data-promote],[data-close]");
  if(!t) return;
  const d = t.dataset, two = k => (d[k]||"").split(":");

  if(d.close!==undefined){ closeOverlays(); return; }
  if(d.go){ e.stopPropagation(); closeOverlays(); go(d.go); return; }
  if(d.branch){ e.stopPropagation(); closeOverlays(); UI.branch=d.branch; UI.mQuery=""; UI.cQuery=""; render(); return; }

  if(d.mfilter){ UI.mFilter=d.mfilter; render(); return; }
  if(d.bfilter){ UI.bFilter=d.bfilter; render(); return; }
  if(d.ffilter){ UI.fFilter=d.ffilter; render(); return; }
  if(d.mtab){ openMember(UI.tabId, d.mtab); return; }

  if(d.renew){ e.stopPropagation(); renewModal(d.renew); return; }
  if(d.dorenew){ doRenew(d.dorenew); return; }
  if(d.pay){ e.stopPropagation(); payModal(d.pay); return; }
  if(d.dopay){ doPay(d.dopay); return; }
  if(d.checkin){ e.stopPropagation(); doCheckin(d.checkin); return; }

  if(d.freeze){
    const m=memberById(d.freeze); m.frozen=!m.frozen; render(); openMember(m.id, UI.tab);
    toast(m.name+(m.frozen?" frozen — billing paused":" unfrozen — back on the floor")); return;
  }
  if(d.cancel){ const m=memberById(d.cancel); m.cancelled=true; closeOverlays(); render(); toast(m.name+" cancelled"); return; }
  if(d.track){
    const m=memberById(d.track);
    m.track = m.track==="fight" ? "fitness" : "fight";
    if(m.track==="fight" && !m.disciplines.some(x=>discById(x).fight)) m.disciplines.unshift("BOX");
    render(); openMember(m.id, m.track==="fight"?"fight":"overview");
    toast(m.name+" moved to the "+(m.track==="fight"?"fight":"fitness")+" track"); return;
  }
  if(d.nudge){
    e.stopPropagation(); const m=memberById(d.nudge);
    m.notes = (m.notes?m.notes+"\n":"")+fmtD(TODAY)+" — win-back call logged.";
    toast("Win-back call logged for "+m.name); save(); return;
  }
  if(d.savenote){ const m=memberById(d.savenote); m.notes=$("#mnote").value; save(); toast("Note saved"); return; }
  if(d.usept){
    const p=S.pt.find(x=>x.memberId===d.usept);
    if(p && p.used<p.total){ p.used++; openMember(d.usept, UI.tab); toast("Session logged · "+(p.total-p.used)+" left"); save(); }
    else toast("That pack is fully used — sell a renewal.");
    return;
  }
  if(d.weigh){
    const m=memberById(d.weigh), w=Number($("#wIn").value);
    if(!w || w<25 || w>200){ toast("Enter a weight between 25 and 200 kg."); return; }
    const before = m.weightClass;
    m.weight = Math.round(w*10)/10; m.weightClass = classFor(m.weight).name;
    render(); openMember(m.id, "fight");
    toast(`${m.name} weighed in at ${m.weight} kg`+(before!==m.weightClass?` · now ${m.weightClass}`:""));
    return;
  }
  if(d.spar){
    const m=memberById(d.spar), r=clamp(Number($("#spRounds").value)||0,1,15);
    S.spars.push({memberId:m.id, branchId:m.branchId, ts:iso(TODAY), rounds:r, partner:$("#spType").value});
    render(); openMember(m.id, "fight");
    toast(`${r} rounds logged for ${m.name} · readiness ${readiness(m).total}`);
    return;
  }

  if(d.move){ e.stopPropagation(); const [id,dir]=two("move"); moveLead(id, Number(dir)); return; }
  if(d.setstage){ e.stopPropagation(); const [id,st]=two("setstage"); setStage(id, st); return; }
  if(d.booktrial){
    const l=S.leads.find(x=>x.id===d.booktrial);
    l.trialDate = iso(addD(TODAY,2)); l.stage="trial";
    l.log.push({ts:iso(TODAY), text:"Free trial booked for "+fmtD(l.trialDate)});
    render(); openLead(l.id); toast("Free trial booked for "+fmtD(l.trialDate)); return;
  }
  if(d.called){
    e.stopPropagation(); const l=S.leads.find(x=>x.id===d.called);
    l.log.push({ts:iso(TODAY), text:"Call logged by "+l.owner});
    l.followUp = iso(addD(TODAY,2));
    if(l.stage==="new") l.stage="contacted";
    render(); if($("#drawer").classList.contains("on")) openLead(l.id);
    toast("Call logged · following up "+fmtDs(l.followUp)); return;
  }
  if(d.addlog){
    const l=S.leads.find(x=>x.id===d.addlog), v=($("#logtxt").value||"").trim();
    if(!v) return; l.log.push({ts:iso(TODAY), text:v}); openLead(l.id); save(); return;
  }
  if(d.convert){
    const l=S.leads.find(x=>x.id===d.convert);
    newMemberModal({name:l.name, phone:l.phone, source:l.source, interest:l.interest, branchId:l.branchId,
      wants:l.wants, fight:DISCIPLINES.find(x=>x.id===l.wants).fight, leadId:l.id});
    return;
  }

  if(d.book){
    const c=S.classes.find(x=>x.id===d.book), mid=$("#bookSel").value;
    if(!mid){ toast("No eligible members at this centre."); return; }
    (c.booked.length<c.cap ? c.booked : c.waitlist).push(mid);
    openClass(c.id); render();
    toast(memberById(mid).name+(c.booked.includes(mid)?" booked into ":" waitlisted for ")+c.name); return;
  }
  if(d.unbook){
    const [cid,mid]=two("unbook"), c=S.classes.find(x=>x.id===cid);
    c.booked=c.booked.filter(x=>x!==mid); c.waitlist=c.waitlist.filter(x=>x!==mid);
    if(c.booked.length<c.cap && c.waitlist.length) c.booked.push(c.waitlist.shift());
    openClass(cid); render(); toast("Removed from "+c.name); return;
  }
  if(d.promote){
    const [cid,mid]=two("promote"), c=S.classes.find(x=>x.id===cid);
    c.waitlist=c.waitlist.filter(x=>x!==mid); c.booked.push(mid);
    openClass(cid); render(); toast(memberById(mid).name+" moved off the waitlist"); return;
  }

  if(d.lead){ openLead(d.lead); return; }
  if(d.class){ openClass(d.class); return; }
  if(d.member){ openMember(d.member, d.mtabjump || undefined); return; }
});

$("#themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+"-theme", next); }catch(err){}
});
try{ const th=localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}

document.addEventListener("click", e=>{
  if(e.target.id==="newLead"){ newLeadModal(); return; }
  if(e.target.id==="doNewLead"){ doNewLead(); return; }
  if(e.target.dataset && e.target.dataset.donew!==undefined){ doNewMember(e.target.dataset.donew); return; }
  if(e.target.id==="exportBtn"){
    showCsv("Members export", csv([["Member ID","Centre","Name","Phone","Plan","Track","Disciplines","Level","Weight class","Status","Start","Expires","Visits 30d","Dues"]]
      .concat(B(S.members).filter(m=>!m.cancelled).map(m=>[m.id,branchById(m.branchId).name,m.name,m.phone,planById(m.planId).name,
        m.track,m.disciplines.map(x=>discById(x).short).join(" / "),m.level,m.weightClass,statusOf(m).key,m.start,m.end,
        visitsSince(m.id,30),duesOf(m.id)]))));
    return;
  }
  if(e.target.id==="exportInv"){
    showCsv("Invoices export", csv([["Invoice","Centre","Member","Item","Issued","Due","Amount","Paid","Status","Method"]]
      .concat(B(S.invoices).map(i=>{const m=memberById(i.memberId);
        return [i.id,branchById(i.branchId).name,m?m.name:"",i.item,i.date,i.due,i.amount,i.paid,i.status,i.method||""];}))));
    return;
  }
  if(e.target.id==="copyCsv"){
    const ta=$("#csvOut"); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Copied")).catch(()=>toast("Select the text and copy"));
    else toast("Select the text and copy");
    return;
  }
  if(!e.target.closest(".search")) $("#gpop").innerHTML = "";
});

/* ---------------- global search ---------------- */
function globalSearch(q){
  q = (q||"").trim().toLowerCase();
  const pop = $("#gpop");
  if(q.length<2){ pop.innerHTML=""; return; }
  const hits = [];
  S.members.filter(m=>(m.name+" "+m.id+" "+m.phone).toLowerCase().includes(q)).slice(0,6)
    .forEach(m=>hits.push({kind:"member", id:m.id, title:m.name,
      sub:m.id+" · "+branchById(m.branchId).name+" · "+planById(m.planId).name+" · "+statusOf(m).label}));
  S.leads.filter(l=>(l.name+" "+l.id+" "+l.phone).toLowerCase().includes(q)).slice(0,4)
    .forEach(l=>hits.push({kind:"lead", id:l.id, title:l.name, sub:"Lead · "+branchById(l.branchId).name+" · "+stageById(l.stage).name}));
  S.invoices.filter(i=>i.id.toLowerCase().includes(q)).slice(0,3)
    .forEach(i=>{const m=memberById(i.memberId);
      hits.push({kind:"member", id:i.memberId, title:i.id, sub:(m?m.name+" · ":"")+money(i.amount)+" · "+i.status});});
  S.classes.filter(c=>c.name.toLowerCase().includes(q)).slice(0,3)
    .forEach(c=>hits.push({kind:"class", id:c.id, title:c.name,
      sub:branchById(c.branchId).name+" · "+DAYNAMES[c.dow]+" "+c.time+" · "+c.room}));
  pop.innerHTML = hits.length
    ? `<div class="search-pop">${hits.map(h=>`<button data-${h.kind}="${h.id}">
        <b style="font-weight:600;font-size:13px">${esc(h.title)}</b>
        <div class="muted" style="font-size:11px">${esc(h.sub)}</div></button>`).join("")}</div>`
    : `<div class="search-pop"><div class="empty">Nothing matches "${esc(q)}"</div></div>`;
}

/* ---------------- clock ---------------- */
function tick(){
  const now = new Date();
  $("#clock").textContent = now.toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short"})
    + " · " + now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}
tick(); setInterval(tick, 30000);
render();
