<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fit and Fight Club CRM</title>
  <meta name="description" content="Member CRM for Fit and Fight Club — Vashi, Nerul and Wagholi. Members, leads and free trials, attendance, timetable, billing and fight-camp readiness.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 36 36" role="img" aria-label="Fit and Fight Club">
        <rect width="36" height="36" rx="5" fill="var(--ink)"></rect>
        <path d="M0 0h13L0 13Z" fill="#C81E28"></path>
        <path d="M36 36H23L36 23Z" fill="#2A5FB8"></path>
        <text x="18" y="25" text-anchor="middle" fill="var(--surface)" font-family="'Big Shoulders Display',sans-serif" font-weight="800" font-size="20">FF</text>
      </svg>
      <div>
        <div class="brand-name">Fit and<br>Fight Club</div>
        <div class="brand-sub">Member CRM</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="creed">Be stronger, harder,<br>faster, better today<br>than yesterday
      <span>Est. 2011 · Navi Mumbai &amp; Pune</span></div>
    <div class="rail-foot">
      <div id="clock" class="num">&mdash;</div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="btn btn-sm btn-ghost" id="themeBtn">Theme</button>
        <button class="btn btn-sm btn-ghost" id="resetBtn" title="Restore the seeded demo data">Reset data</button>
      </div>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div>
        <div class="page-title" id="ptitle">Dashboard</div>
        <div class="page-sub" id="psub"></div>
      </div>
      <div class="branch-pick" id="branchPick"></div>
      <div class="search" style="margin-left:auto">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="gsearch" type="search" placeholder="Search members, leads, invoices..." autocomplete="off">
        <div id="gpop"></div>
      </div>
      <button class="btn" id="checkinBtn">Check in</button>
      <button class="btn btn-primary" id="newBtn">New member</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Record detail"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>

  <!-- Load order matters: each file adds to the shared global scope. -->
  <script src="assets/js/core.js"></script>
  <script src="assets/js/club.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/model.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/members.js"></script>
  <script src="assets/js/views/fighters.js"></script>
  <script src="assets/js/views/checkin.js"></script>
  <script src="assets/js/views/leads.js"></script>
  <script src="assets/js/views/classes.js"></script>
  <script src="assets/js/views/coaches.js"></script>
  <script src="assets/js/views/billing.js"></script>
  <script src="assets/js/actions.js"></script>
  <script src="assets/js/events.js"></script>
</body>
</html>
